name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck flutter-reap test.sh   # preinstalled on the Linux runner only
        if: matrix.os == 'ubuntu-latest'
      - run: ./test.sh
